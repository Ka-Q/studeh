<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Studeh</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <header id="toolbar">
        <div class="flex-row">
            <button id="btn-new">
                <span class="icon icon-new" aria-hidden="true"></span>
                <span>New</span>
            </button>
            <button id="btn-open">
                <span class="icon icon-open" aria-hidden="true"></span>
                <span>Open</span>
            </button>
            <button id="btn-save" disabled>
                <span class="icon icon-save" aria-hidden="true"></span>
                <span>Save</span>
            </button>
        </div>
        <div id="doc-title-group" class="flex-row">
            <span id="doc-title">No document open</span>
            <button id="btn-rename-document" class="icon-button" disabled title="Rename document" aria-label="Rename document">
                <span class="icon icon-rename" aria-hidden="true"></span>
            </button>
            <span id="dirty-indicator" hidden>Unsaved changes</span>
        </div>
        <div class="flex-row toolbar-end">
            <span class="flex-row">
                <span id="mode-status">Currently editing</span>
                <button id="btn-mode-toggle" disabled>Switch to studying</button>
            </span>
            <button id="btn-theme-toggle" class="icon-button" title="Toggle theme" aria-label="Toggle theme">
                <span id="theme-icon" class="icon" aria-hidden="true"></span>
            </button>
        </div>
    </header>
    <div id="app">
        <aside id="page-sidebar">
            <div id="sidebar-header">
                <button id="btn-collapse-sidebar" class="icon-button" title="Collapse sidebar" aria-label="Collapse sidebar">
                    <span class="icon icon-chevron-left" aria-hidden="true"></span>
                </button>
            </div>
            <ul id="page-list"></ul>
            <button id="btn-add-page">Add page</button>
        </aside>
        <div id="sidebar-resize-handle"></div>
        <button id="btn-expand-sidebar" class="icon-button" hidden title="Show sidebar" aria-label="Show sidebar">
            <span class="icon icon-chevron-right" aria-hidden="true"></span>
        </button>
        <main id="canvas-area">No document open. Use New or Open to get started.</main>
    </div>
    <dialog id="open-dialog">
        <div id="open-dialog-header">
            <button id="btn-close-open-dialog">
                <span class="icon icon-cancel" aria-hidden="true"></span>
                <span>Cancel</span>
            </button>
            <h2>Choose a document</h2>
            <button id="btn-sort-documents"></button>
        </div>
        <ul id="document-list"></ul>
    </dialog>
    <dialog id="confirm-dialog">
        <h2 id="confirm-dialog-title"></h2>
        <p id="confirm-dialog-message"></p>
        <div id="confirm-dialog-actions">
            <button id="btn-cancel-confirm">
                <span class="icon icon-cancel" aria-hidden="true"></span>
                <span>Cancel</span>
            </button>
            <button id="btn-confirm-delete" class="button-danger">
                <span class="icon icon-trash" aria-hidden="true"></span>
                <span>Delete</span>
            </button>
        </div>
    </dialog>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
