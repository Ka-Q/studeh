<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Studeh</title>
    <script src="/js/themeInit.js"></script>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <header id="toolbar">
        <div class="flex-row">
            <button id="btn-new">
                <span class="icon icon-new" aria-hidden="true"></span>
                <span>New</span>
            </button>
            <button id="btn-browse">
                <span class="icon icon-browse" aria-hidden="true"></span>
                <span>Browse</span>
            </button>
            <button id="btn-save" disabled>
                <span class="icon icon-save" aria-hidden="true"></span>
                <span>Save</span>
            </button>
        </div>
        <div id="doc-title-group" class="flex-row">
            <span id="doc-title">No document open</span>
            <button id="btn-rename-document" class="icon-button" hidden title="Rename document" aria-label="Rename document">
                <span class="icon icon-rename" aria-hidden="true"></span>
            </button>
            <span id="dirty-indicator" hidden>Unsaved changes</span>
        </div>
        <div class="flex-row toolbar-end">
            <button id="btn-theme-toggle" class="icon-button" title="Toggle theme" aria-label="Toggle theme">
                <span id="theme-icon" class="icon" aria-hidden="true"></span>
            </button>
        </div>
    </header>
    <div id="app">
        <aside id="page-sidebar">
            <div id="sidebar-header">
                <div id="sidebar-bulk-actions">
                    <input type="checkbox" id="select-all-pages" title="Select all pages" aria-label="Select all pages">
                    <button id="btn-delete-selected-pages" disabled title="Delete selected pages" aria-label="Delete selected pages">
                        <span class="icon icon-trash" aria-hidden="true"></span>
                        <span id="delete-selected-label">Delete selected</span>
                    </button>
                </div>
                <button id="btn-collapse-sidebar" class="icon-button" title="Collapse sidebar" aria-label="Collapse sidebar">
                    <span class="icon icon-chevron-left" aria-hidden="true"></span>
                </button>
            </div>
            <div id="page-list-wrapper" class="scroll-fade-wrapper">
                <ul id="page-list"></ul>
                <div id="page-list-fade" class="scroll-fade" aria-hidden="true"></div>
            </div>
            <div id="sidebar-footer">
                <button id="btn-add-page" disabled>New empty page</button>
                <button id="btn-add-pages-from-images" disabled>
                    <span class="icon icon-image-placeholder" aria-hidden="true"></span>
                    New from image(s)
                </button>
            </div>
        </aside>
        <div id="sidebar-resize-handle"></div>
        <button id="btn-expand-sidebar" class="icon-button" hidden title="Show sidebar" aria-label="Show sidebar">
            <span class="icon icon-chevron-right" aria-hidden="true"></span>
        </button>
        <main id="canvas-area">No document open. Use New or Browse to get started.</main>
    </div>
    <dialog id="browse-dialog">
        <div id="browse-dialog-header">
            <button id="btn-close-browse-dialog">
                <span class="icon icon-cancel" aria-hidden="true"></span>
                <span>Cancel</span>
            </button>
            <h2>Browse documents</h2>
            <button id="btn-sort-documents"></button>
        </div>
        <div id="document-list-wrapper" class="scroll-fade-wrapper">
            <ul id="document-list"></ul>
            <div id="document-list-fade" class="scroll-fade" aria-hidden="true"></div>
        </div>
    </dialog>
    <dialog id="confirm-dialog" class="simple-dialog">
        <h2 id="confirm-dialog-title"></h2>
        <p id="confirm-dialog-message"></p>
        <div class="simple-dialog-actions">
            <button id="btn-cancel-confirm">
                <span class="icon icon-cancel" aria-hidden="true"></span>
                <span>Cancel</span>
            </button>
            <button id="btn-confirm-delete">
                <span id="confirm-dialog-icon" class="icon icon-trash" aria-hidden="true"></span>
                <span id="confirm-dialog-label">Delete</span>
            </button>
        </div>
    </dialog>
    <dialog id="notice-dialog" class="simple-dialog">
        <div class="notice-dialog-header">
            <span class="icon icon-warning" aria-hidden="true"></span>
            <h2 id="notice-dialog-title"></h2>
        </div>
        <p id="notice-dialog-message"></p>
        <div class="simple-dialog-actions">
            <button id="btn-notice-ok">
                <span>OK</span>
            </button>
        </div>
    </dialog>
    <dialog id="new-document-dialog" class="simple-dialog">
        <h2>New document</h2>
        <form id="new-document-form">
            <label class="dialog-field-label" for="new-document-name">Name</label>
            <input id="new-document-name" class="dialog-field" type="text" required>
            <div class="simple-dialog-actions">
                <button type="button" id="btn-cancel-new-document">
                    <span class="icon icon-cancel" aria-hidden="true"></span>
                    <span>Cancel</span>
                </button>
                <button type="submit" id="btn-confirm-new-document">
                    <span class="icon icon-new" aria-hidden="true"></span>
                    <span>Create</span>
                </button>
            </div>
        </form>
    </dialog>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
