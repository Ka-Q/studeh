<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Studeh</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <header id="toolbar">
        <button id="btn-new">New</button>
        <button id="btn-open">Open</button>
        <button id="btn-save" disabled>Save</button>
        <span id="doc-title">No document open</span>
        <button id="btn-rename-document" disabled>Rename</button>
        <span id="dirty-indicator" hidden>Unsaved changes</span>
        <span class="mode-toggle">
            <button id="btn-mode-edit" class="active" disabled>Edit Mode</button>
            <button id="btn-mode-study" disabled>Study Mode</button>
        </span>
    </header>
    <div id="app">
        <aside id="page-sidebar">
            <ul id="page-list"></ul>
            <button id="btn-add-page">Add page</button>
        </aside>
        <main id="canvas-area">No document open. Use New or Open to get started.</main>
    </div>
    <dialog id="open-dialog">
        <h2>Open document</h2>
        <ul id="document-list"></ul>
        <button id="btn-close-open-dialog">Cancel</button>
    </dialog>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
